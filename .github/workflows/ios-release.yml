name: iOS App Store release

# Manual only: build, upload to App Store Connect, set What's New, submit for App Review
# (automatic release after approval). No TestFlight distribution. Pushes do not trigger builds.
on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Submit to App Review (automatic release after approval)"
        type: boolean
        default: true
      release_notes:
        description: "What's New (en-US)"
        type: string
        default: "Bug fixes and improvements."

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Write Firebase config (GoogleService-Info.plist from secret)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          # Firebase Analytics calls FirebaseApp.configure() at launch; a build without this file crashes.
          if [[ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]]; then
            echo "::error::Missing secret GOOGLE_SERVICE_INFO_PLIST_BASE64 (base64 of GoogleService-Info.plist)" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist >/dev/null
          echo "GoogleService-Info.plist written ($(wc -c < ios/App/App/GoogleService-Info.plist) bytes)"

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Enforce iOS 15.0+ deployment target (ITMS-90068)
        run: |
          set -euo pipefail
          MIN=15.0
          if [[ -f ios/App/Podfile ]]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '${MIN}'/" ios/App/Podfile
          fi
          if [[ -f ios/App/App.xcodeproj/project.pbxproj ]]; then
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${MIN};/g" ios/App/App.xcodeproj/project.pbxproj
          fi
          echo "Podfile:"; grep "platform :ios" ios/App/Podfile || true
          echo "pbxproj targets:"; grep IPHONEOS_DEPLOYMENT_TARGET ios/App/App.xcodeproj/project.pbxproj | sort -u
          if grep -E "IPHONEOS_DEPLOYMENT_TARGET = (1[0-4]|[0-9])\." ios/App/App.xcodeproj/project.pbxproj; then
            echo "::error::IPHONEOS_DEPLOYMENT_TARGET still below 15.0 (ITMS-90068)" >&2
            exit 1
          fi
          if grep -E "platform :ios, '(1[0-4]|[0-9])\." ios/App/Podfile; then
            echo "::error::Podfile platform still below 15.0 (ITMS-90068)" >&2
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install CocoaPods deps
        run: |
          gem install cocoapods --no-document
          cd ios/App && pod install

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build, upload & submit (App Store)
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: fastlane ios release
